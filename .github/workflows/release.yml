name: Publish Release to NuGet

on:
  workflow_dispatch:

env:
  Configuration: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
  TERM: xterm-256color

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    name: Publish to NuGet
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.x
            8.x
            10.x

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          $v = (dotnet msbuild QrCodeGenerator/QrCodeGenerator.csproj -getProperty:PackageVersion).Trim()
          if (-not $v) { throw "PackageVersion could not be determined" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing version $v"

      - name: Run tests
        run: dotnet test --verbosity normal

      - name: Create and validate NuGet package
        run: |
          dotnet tool restore
          dotnet pack QrCodeGenerator/QrCodeGenerator.csproj --verbosity normal

      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: >
          dotnet nuget push
          QrCodeGenerator/bin/Release/Net.Codecrete.QrCodeGenerator.${{ steps.version.outputs.version }}.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate
